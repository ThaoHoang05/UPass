<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Xác thực bảo mật</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      text-align: center; 
      padding: 30px 20px; 
      background: #181825; 
      color: #cdd6f4; 
      margin: 0;
    }
    .icon { font-size: 45px; margin-bottom: 10px; }
    h3 { margin: 10px 0; font-size: 16px; font-weight: 500;}
    p { font-size: 13px; color: #a6adc8; margin-bottom: 20px;}
    button { 
      padding: 10px 24px; 
      background: #89b4fa; 
      color: #11111b; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 14px; 
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover { background: #74c7ec; }
  </style>
</head>
<body>
  <div class="icon">🛡️</div>
  <h3 id="statusText">Xác thực để điền mật khẩu</h3>
  <p id="subText">Trình duyệt cần bạn xác nhận danh tính.</p>
  
  <button id="btnStartVerify">Tiếp tục</button>
  
  <script src="verify.js"></script>
</body>
</html>
